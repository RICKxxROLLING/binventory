services:
  binventory:
    build: .
    image: ghcr.io/rickxxrolling/binventory:latest
    container_name: binventory
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Address your phone uses to reach the server. Printed into every QR code.
      - BASE_URL=http://192.168.1.10:8080
      - BIN_PREFIX=BIN
      - TZ=America/Los_Angeles
      # Optional login (leave blank for none)
      - AUTH_USER=
      - AUTH_PASS=
      # Optional local AI (Ollama vision model) that describes and tags bins from their photos
      - OLLAMA_URL=
      - OLLAMA_MODEL=gemma3:4b
    volumes:
      - /mnt/user/appdata/binventory:/data
