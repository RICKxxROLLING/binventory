<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bin Scanner">
  <link rel="manifest" href="/scan.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>Bin Scanner</title>
  <style>
    /* Plain CSS on purpose: this page has to run on old iPads (iOS 12+) */
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f12; color: #eceef1; overflow: hidden;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; background: #111418; }
    .brand { display: flex; align-items: center; font-weight: 700; font-size: 20px; }
    .brand img { width: 30px; height: 30px; margin-right: 10px; }
    .status { font-size: 15px; color: #9099a6; display: flex; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #3fb950; margin-right: 8px; }
    .dot.off { background: #d93a3a; }
    .status .clock { margin-left: 16px; font-variant-numeric: tabular-nums; }
    #view { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 22px; }

    /* ready screen */
    .ready { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ready .icon { width: 150px; height: 150px; border-radius: 34px; background: #f5a524; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; animation: pulse 2.4s ease-in-out infinite; }
    .ready .icon svg { width: 90px; height: 90px; }
    .ready h1 { font-size: 46px; margin: 0 0 10px; }
    .ready p { color: #9099a6; margin: 0; font-size: 20px; }
    .ready .manual { margin-top: 34px; }
    @keyframes pulse { 50% { transform: scale(.94); opacity: .85; } }
    .recent { margin-top: 40px; width: 100%; max-width: 640px; }
    .recent h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #9099a6; margin: 0 0 8px; text-align: left; }
    .recent a { display: flex; justify-content: space-between; padding: 12px 14px; background: #171a1f; border-radius: 12px; margin-bottom: 8px; text-decoration: none; text-align: left; }
    .recent a span:last-child { color: #9099a6; }

    /* bin screen */
    .band { background: #f5a524; color: #111418; border-radius: 20px; display: flex; padding: 16px 8px; margin-bottom: 18px; }
    .band div { -webkit-flex: 1 1 auto; flex: 1 1 auto; padding: 0 18px; min-width: 0; }
    .band div + div { border-left: 2px solid rgba(17,20,24,.25); }
    .band small { display: block; font-size: 15px; font-weight: 800; letter-spacing: .14em; opacity: .7; }
    .band strong { display: block; font-size: 84px; line-height: 1; font-weight: 800; word-wrap: break-word; }
    .head { display: flex; align-items: flex-start; }
    .head .text { flex: 1; min-width: 0; }
    .code { color: #9099a6; font-size: 16px; letter-spacing: .06em; }
    h2 { font-size: 40px; margin: 2px 0 6px; line-height: 1.15; }
    .desc { color: #b8bec8; font-size: 20px; margin: 0 0 14px; }
    .photo { width: 210px; height: 210px; border-radius: 16px; background: #171a1f center/cover no-repeat; margin-left: 18px; flex: none; }
    .cols { display: flex; align-items: flex-start; }
    .card { background: #171a1f; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
    .card h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #9099a6; }
    .items { list-style: none; margin: 0; padding: 0; -webkit-columns: 2; columns: 2; -webkit-column-gap: 28px; column-gap: 28px; }
    .items li { padding: 6px 0; font-size: 21px; -webkit-column-break-inside: avoid; break-inside: avoid; }
    .items b { color: #f5a524; display: inline-block; min-width: 46px; }
    .tags span { display: inline-block; border: 1px solid #2a2f37; border-radius: 999px; padding: 3px 12px; margin: 0 6px 6px 0; font-size: 16px; }
    .banner { border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; font-size: 20px; }
    .banner.warn { background: #3b2a0b; border: 2px solid #f5a524; }
    .banner.ok { background: #10291a; border: 2px solid #3fb950; font-size: 17px; }
    .banner .btn { margin-top: 12px; margin-right: 10px; }
    .btn { display: inline-block; padding: 14px 22px; border-radius: 14px; border: 1px solid #2a2f37; background: #171a1f; color: #eceef1; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .btn.primary { background: #f5a524; border-color: #f5a524; color: #111418; }
    .actions { margin-top: 6px; }
    .actions .btn { margin: 0 10px 10px 0; }
    .timer { height: 4px; background: #2a2f37; border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
    .timer div { height: 100%; background: #f5a524; width: 100%; -webkit-transition: width linear; transition: width linear; }
    .error { text-align: center; padding-top: 12vh; }
    .error h1 { font-size: 40px; margin: 0 0 10px; color: #ff7b72; }
    .error p { color: #9099a6; font-size: 20px; }
    .hint { color: #9099a6; font-size: 15px; }
    @media (max-width: 700px) { .band strong { font-size: 56px; } h2 { font-size: 30px; } .photo { width: 120px; height: 120px; } .items { -webkit-columns: 1; columns: 1; } }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="/icon.svg" alt=""> Bin Scanner</div>
    <div class="status"><span class="dot" id="dot"></span><span id="conn">Connected</span><span class="clock" id="clock"></span></div>
  </div>
  <div id="view"></div>
  <script src="/scan.js"></script>
</body>
</html>
